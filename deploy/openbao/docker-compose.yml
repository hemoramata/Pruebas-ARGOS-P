services:
  openbao:
    image: openbao/openbao:2.6
    restart: unless-stopped
    command: server -config=/openbao/config/openbao.hcl
    env_file:
      - ./openbao.env
    volumes:
      - openbao-data:/openbao/data
      - ./config:/openbao/config:ro
      - ./tls:/openbao/tls:ro
    networks:
      - argos-kms
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  openbao-data:

networks:
  argos-kms:
    internal: true
